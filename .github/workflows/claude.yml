name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    # Runs only when ero-qt mentions @claude, so nobody else can start a run.
    if: |
      github.event.sender.login == 'ero-qt' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: run claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
          plugin_marketplaces: |
            https://github.com/ero-qt/ero-skills.git
            https://github.com/dotnet/skills.git
            https://github.com/anthropics/claude-code.git
          plugins: |
            repo-writing@ero-qt-skills
            code-comments@ero-qt-skills
            dotnet@dotnet-agent-skills
            dotnet-test@dotnet-agent-skills
            dotnet-msbuild@dotnet-agent-skills
            dotnet-diag@dotnet-agent-skills
            code-review@claude-code-plugins
